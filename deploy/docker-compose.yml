# Local dependencies. The app image is behind the "app" profile; Oracle Free is behind "oracle".
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml --profile oracle up -d
#   docker compose -f deploy/docker-compose.yml --profile app up -d --build
services:
  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

  sftp:
    image: atmoz/sftp:alpine
    ports:
      - "2222:22"
    command: mdp:mdp:::upload

  oracle:
    profiles: ["oracle"]
    image: gvenzl/oracle-free:23-slim
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: mdp
      APP_USER_PASSWORD: mdp

  publisher:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      - kafka
      - sftp
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      MDP_KAFKA_BOOTSTRAP: kafka:9092
      MDP_SFTP_HOST: sftp
      MDP_SFTP_PORT: "22"
      MDP_SFTP_USER: mdp
      MDP_SFTP_PASSWORD: mdp
      MDP_SFTP_DIR: upload
